---

# AppDaemon Updater

appdaemon_updater:
  module: appdaemon_updater
  class: Updater

# Commit Files to VCS

lovelace_file_committer:
  module: lovelace_file_committer
  class: LovelaceFileCommitter
  github_token: !secret appdaemon_github_token
  github_email: !secret google_maps_location_tracker_email

version_file_committer:
  module: version_file_committer
  class: VersionFileCommitter
  github_token: !secret appdaemon_github_token
  github_email: !secret google_maps_location_tracker_email

# Cursor Usage

cursor_usage_monitor:
  module: usage_monitor
  class: CursorUsageMonitor
  poll_interval_seconds: 300

  mqtt_host: !secret appdaemon_mqtt_host
  mqtt_port: 1883
  mqtt_username: !secret appdaemon_mqtt_username
  mqtt_password: !secret appdaemon_mqtt_password
  mqtt_discovery_prefix: homeassistant
  mqtt_device_id: appdaemon_cursor_usage
  mqtt_device_name: Cursor
  mqtt_base_topic: appdaemon/cursor_usage

# qBittorrent Storage Cleanup

qbittorrent_storage_cleanup:
  module: storage_cleanup
  class: QbittorrentStorageCleanup
  storage_entity: sensor.storage_cc_scratch_qbt_disk_used_percentage
  threshold_entity: input_number.qbittorrent_storage_cleanup_threshold
  threshold: 99.9
  reset_below: 98.0
  post_delete_check_delay: 90
  ratio_progress_weight: 1.25  # Makes ratio 4/5 tie with time 28/28 days.
  request_timeout: 15

  qbittorrent_url: !secret qbittorrent_url
  qbittorrent_username: !secret qbittorrent_username
  qbittorrent_password: !secret qbittorrent_password

  notify_script: script.notify_will
  notification_id: qbt_storage_cleanup
  notification_url: !secret qbittorrent_url

# Habit and Mood Tracker

habit_tracker:
  module: habit.habit_tracker
  class: HabitTracker
  users:
    - will
    - vic
  store_directory: /homeassistant/.appdaemon/habits
  reminders_enabled: true
  # Cutover flag: leave false until the new completion entities are configured
  # and verified, then enable to let templates complete habits.
  template_evaluation_enabled: false
  template_eval_debounce_seconds: 2
  ai_task_entity: ai_task.habit_reminder_ai

  mqtt_host: !secret appdaemon_mqtt_host
  mqtt_port: 1883
  mqtt_username: !secret appdaemon_mqtt_username
  mqtt_password: !secret appdaemon_mqtt_password
  mqtt_discovery_prefix: homeassistant
  mqtt_base_topic: appdaemon/habits

  context_labels:
    calendar:
      will: habit_context_calendar_will
      vic: habit_context_calendar_vic
    home: habit_context_home
    work: habit_context_work
    family: habit_context_family

  user_config:
    will:
      notify_script: script.notify_will
      dashboard_url: /home-will/health-fitness
      mood_reminders_default: true
      mood_context_prompts_default: true
      person_entity: person.will
      at_work_entity: binary_sensor.will_at_work
      workday_entity: binary_sensor.workday
      activity_entity: sensor.will_s_pixel_6_pro_detected_activity
      weather_entity: weather.met_office_fulham
    vic:
      notify_script: script.notify_vic
      dashboard_url: /dashboard-mobile/vic-habits
      mood_reminders_default: false
      mood_context_prompts_default: false
      person_entity: person.vic
      at_work_entity: binary_sensor.vic_at_work
      workday_entity: binary_sensor.workday
      activity_entity: sensor.vics_iphone_activity
      weather_entity: weather.met_office_fulham

# Pro Breeze AC

pro_breeze_ac:
  module: pro_breeze_ac
  class: ProBreezeAC
  device_id: !secret pro_breeze_ac_device_id
  local_key: !secret pro_breeze_ac_local_key
  ip: !secret pro_breeze_ac_ip
  version: 3.5
  poll_interval: 30

  dp_power: '1'
  dp_target_temp: '2'
  dp_current_temp: '3'
  dp_mode: '4'
  dp_fan: '5'
  dp_swing: '15'
  dp_sleep: '101'

  mqtt_host: !secret appdaemon_mqtt_host
  mqtt_port: 1883
  mqtt_username: !secret appdaemon_mqtt_username
  mqtt_password: !secret appdaemon_mqtt_password
  mqtt_discovery_prefix: homeassistant
  mqtt_object_id: pro_breeze_ac
  mqtt_unique_id: pro_breeze_ac
  mqtt_name: Pro Breeze AC
  mqtt_base_topic: appdaemon/pro_breeze_ac

  raw_sensor: sensor.pro_breeze_ac_raw_state

# Student Loan (SLC)

slc_balance:
  module: slc_balance
  class: SlcBalance
  username: !secret slc_username
  password: !secret slc_password
  secret_answer: !secret slc_secret_answer
  poll_interval: 21600

  mqtt_host: !secret appdaemon_mqtt_host
  mqtt_port: 1883
  mqtt_username: !secret appdaemon_mqtt_username
  mqtt_password: !secret appdaemon_mqtt_password
  mqtt_discovery_prefix: homeassistant
  mqtt_device_id: appdaemon_slc_student_loan
  mqtt_device_name: Student Loan
  mqtt_base_topic: appdaemon/slc

  raw_sensor: sensor.slc_last_poll

