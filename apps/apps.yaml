# Monzo

oauth_callback_broker:
  module: oauth_callback_broker
  class: OAuthCallbackBroker
  redirect_uri: !secret oauth_callback_redirect_uri
  state_db: /data/oauth_callback/pending_flows.sqlite3

monzo_auto_saver:
  module: auto_saver
  class: AutoSaver
  dependencies: oauth_callback_broker
  monzo_client_id: !secret monzo_auto_saver_client_id
  monzo_client_secret: !secret monzo_auto_saver_client_secret
  savings_pot_id: !secret monzo_savings_pot_id
  spotify_client_id: !secret spotify_monzo_auto_save_client_id
  spotify_client_secret: !secret spotify_monzo_auto_save_client_secret
  truelayer_client_id: !secret truelayer_client_id
  truelayer_client_secret: !secret truelayer_client_secret
  truelayer_reauth_var: var.truelayer_reauth_amex_auto_saver
  truelayer_reauth_trigger: input_button.oauth_reauth_truelayer_amex_auto_saver
  monzo_reauth_var: var.monzo_reauth_auto_saver
  monzo_reauth_trigger: input_button.oauth_reauth_monzo_auto_saver
  spotify_reauth_var: var.spotify_reauth_auto_saver
  spotify_reauth_trigger: input_button.oauth_reauth_spotify_auto_saver

monzo_credit_card_pot_manager:
  module: credit_card_pot_manager
  class: CreditCardPotManager
  dependencies: oauth_callback_broker
  client_id: !secret monzo_client_id
  client_secret: !secret monzo_client_secret
  reauth_var: var.monzo_reauth_cc_pot_top_up
  reauth_trigger: input_button.oauth_reauth_monzo_cc_pot_top_up

# Spotify Dynamic Playlists

spotify_track_processor:
  module: track_processor
  class: SpotifyTrackProcessor
  dependencies: oauth_callback_broker
  client_id: !secret spotify_pyscript_client_id
  client_secret: !secret spotify_pyscript_client_secret
  reauth_var: var.spotify_reauth_track_processor
  reauth_trigger: input_button.oauth_reauth_spotify_track_processor

# TrueLayer Variables

amex_balance_getter:
  module: bank_balance
  class: BankBalanceGetter
  dependencies: oauth_callback_broker
  bank_ref: AMEX
  client_id: !secret truelayer_client_id
  client_secret: !secret truelayer_client_secret
  reauth_var: var.truelayer_reauth_amex
  reauth_trigger: input_button.oauth_reauth_truelayer_amex
  card_ids:
    no_ref:

amex_vic_balance_getter:
  module: bank_balance
  class: BankBalanceGetter
  dependencies: oauth_callback_broker
  bank_ref: AMEX
  variant_ref: amex_vic
  notify_script: script.notify_vic
  client_id: !secret truelayer_client_id
  client_secret: !secret truelayer_client_secret
  reauth_var: var.truelayer_reauth_amex_vic
  reauth_trigger: input_button.oauth_reauth_truelayer_amex_vic
  card_ids:
    no_ref:

hsbc_balance_getter:
  module: bank_balance
  class: BankBalanceGetter
  dependencies: oauth_callback_broker
  bank_ref: HSBC
  client_id: !secret truelayer_client_id
  client_secret: !secret truelayer_client_secret
  reauth_var: var.truelayer_reauth_hsbc
  reauth_trigger: input_button.oauth_reauth_truelayer_hsbc
  account_ids:
    current_account: !secret truelayer_hsbc_current_account_id

