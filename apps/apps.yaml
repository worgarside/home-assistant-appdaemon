---

# AppDaemon Updater

appdaemon_updater:
  module: appdaemon_updater
  class: Updater

# Commit Files to VCS

lovelace_file_committer:
  module: lovelace_file_committer
  class: LovelaceFileCommitter
  github_token: !secret appdaemon_github_token
  github_email: !secret google_maps_location_tracker_email

version_file_committer:
  module: version_file_committer
  class: VersionFileCommitter
  github_token: !secret appdaemon_github_token
  github_email: !secret google_maps_location_tracker_email

# Cursor Usage

cursor_usage_monitor:
  module: usage_monitor
  class: CursorUsageMonitor
  poll_interval_seconds: 300

  mqtt_host: !secret appdaemon_mqtt_host
  mqtt_port: 1883
  mqtt_username: !secret appdaemon_mqtt_username
  mqtt_password: !secret appdaemon_mqtt_password
  mqtt_discovery_prefix: homeassistant
  mqtt_device_id: appdaemon_cursor_usage
  mqtt_device_name: Cursor
  mqtt_base_topic: appdaemon/cursor_usage

# Habit and Mood Tracker

habit_tracker:
  module: habit.habit_tracker
  class: HabitTracker
  users:
    - will
    - vic
  store_directory: /homeassistant/.appdaemon/habits
  reminders_enabled: true
  ai_task_entity: ai_task.habit_reminder_ai

  mqtt_host: !secret appdaemon_mqtt_host
  mqtt_port: 1883
  mqtt_username: !secret appdaemon_mqtt_username
  mqtt_password: !secret appdaemon_mqtt_password
  mqtt_discovery_prefix: homeassistant
  mqtt_base_topic: appdaemon/habits

  context_labels:
    calendar:
      will: habit_context_calendar_will
      vic: habit_context_calendar_vic
    home: habit_context_home
    work: habit_context_work
    family: habit_context_family

  user_config:
    will:
      notify_script: script.notify_will
      dashboard_url: /home-will/health-fitness
      person_entity: person.will
      at_work_entity: binary_sensor.will_at_work
      workday_entity: binary_sensor.workday
      activity_entity: sensor.will_s_pixel_6_pro_detected_activity
      steps_entity: sensor.will_s_pixel_6_pro_daily_steps
      weather_entity: weather.met_office_fulham
      sun_entity: sun.sun
    vic:
      notify_script: script.notify_vic
      dashboard_url: /dashboard-mobile/vic-habits
      person_entity: person.vic
      at_work_entity: binary_sensor.vic_at_work
      workday_entity: binary_sensor.workday
      activity_entity: sensor.vics_iphone_activity
      steps_entity: sensor.vics_iphone_steps
      weather_entity: weather.met_office_fulham
      sun_entity: sun.sun

# Pro Breeze AC

pro_breeze_ac:
  module: pro_breeze_ac
  class: ProBreezeAC
  device_id: !secret pro_breeze_ac_device_id
  local_key: !secret pro_breeze_ac_local_key
  ip: !secret pro_breeze_ac_ip
  version: 3.5
  poll_interval: 30

  dp_power: '1'
  dp_target_temp: '2'
  dp_current_temp: '3'
  dp_mode: '4'
  dp_fan: '5'
  dp_swing: '15'
  dp_sleep: '101'

  mqtt_host: !secret appdaemon_mqtt_host
  mqtt_port: 1883
  mqtt_username: !secret appdaemon_mqtt_username
  mqtt_password: !secret appdaemon_mqtt_password
  mqtt_discovery_prefix: homeassistant
  mqtt_object_id: pro_breeze_ac
  mqtt_unique_id: pro_breeze_ac
  mqtt_name: Pro Breeze AC
  mqtt_base_topic: appdaemon/pro_breeze_ac

  raw_sensor: sensor.pro_breeze_ac_raw_state

# Student Loan (SLC)

slc_balance:
  module: slc_balance
  class: SlcBalance
  username: !secret slc_username
  password: !secret slc_password
  secret_answer: !secret slc_secret_answer
  poll_interval: 21600

  mqtt_host: !secret appdaemon_mqtt_host
  mqtt_port: 1883
  mqtt_username: !secret appdaemon_mqtt_username
  mqtt_password: !secret appdaemon_mqtt_password
  mqtt_discovery_prefix: homeassistant
  mqtt_device_id: appdaemon_slc_student_loan
  mqtt_device_name: Student Loan
  mqtt_base_topic: appdaemon/slc

  raw_sensor: sensor.slc_last_poll

# Robot Vacuum

# cosmo_monitor:
#   module: cosmo_monitor
#   class: CosmoMonitor

# Log Processor

# log_processor:
#   module: log_processor
#   class: LogProcessor

# Monzo

monzo_auto_saver:
  module: auto_saver
  class: AutoSaver
  monzo_client_id: !secret monzo_auto_saver_client_id
  monzo_client_secret: !secret monzo_auto_saver_client_secret
  savings_pot_id: !secret monzo_savings_pot_id
  spotify_client_id: !secret spotify_monzo_auto_save_client_id
  spotify_client_secret: !secret spotify_monzo_auto_save_client_secret
  truelayer_client_id: !secret truelayer_client_id
  truelayer_client_secret: !secret truelayer_client_secret
  truelayer_reauth_var: var.truelayer_reauth_amex_auto_saver

monzo_credit_card_pot_manager:
  module: credit_card_pot_manager
  class: CreditCardPotManager
  client_id: !secret monzo_client_id
  client_secret: !secret monzo_client_secret

# Spotify Dynamic Playlists

spotify_track_processor:
  module: track_processor
  class: SpotifyTrackProcessor
  client_id: !secret spotify_pyscript_client_id
  client_secret: !secret spotify_pyscript_client_secret

# TrueLayer Variables

amex_balance_getter:
  module: bank_balance
  class: BankBalanceGetter
  bank_ref: AMEX
  client_id: !secret truelayer_client_id
  client_secret: !secret truelayer_client_secret
  reauth_var: var.truelayer_reauth_amex
  card_ids:
    no_ref:

hsbc_balance_getter:
  module: bank_balance
  class: BankBalanceGetter
  bank_ref: HSBC
  client_id: !secret truelayer_client_id
  client_secret: !secret truelayer_client_secret
  reauth_var: var.truelayer_reauth_hsbc
  account_ids:
    current_account: !secret truelayer_hsbc_current_account_id

